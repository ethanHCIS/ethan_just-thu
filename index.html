<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orb Dominion</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height:100vh; overflow:auto;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    background:#050514; color:#fff; font-family:Arial, Helvetica, sans-serif;
    padding:28px;
  }
  h1 { font-size:clamp(20px,4.5vw,34px); letter-spacing:3px; text-shadow:0 0 12px #7b5fff; margin:0; }

  .login-panel {
    max-width: 380px;
    margin: 10px auto;
    padding: 14px;
    background: #100f25;
    border: 1px solid #7665ff;
    border-radius: 12px;
    text-align: center;
  }
  .login-panel h2 { margin:0 0 6px 0; font-size:16px; }
  .login-panel p { margin:6px 0 12px 0; color:#bdb8ff; font-size:13px; }
  .login-panel button {
    display:block; width:100%; margin:8px 0; padding:10px 12px;
    border-radius:8px; border:0; cursor:pointer; background:#2a264a; color:#fff;
  }
  #loginMessage { color: #bdb8ff; font-size: 13px; margin-top:6px; }

  .orb {
    width: min(44vw, 220px); aspect-ratio:1; border-radius:50%;
    position:relative; transition: transform .28s ease, filter .2s ease, box-shadow .2s ease;
    display:block;
  }
  .orb::before { content:""; position:absolute; inset:-14%; border-radius:50%; opacity:.55;
    border:2px solid #8c72ff; transform:rotateX(65deg); animation: spin 6s linear infinite; }
  .orb.powered { transform:scale(1.16); filter:brightness(1.6); box-shadow:0 0 40px rgba(120,200,255,0.5); }
  @keyframes spin { to { transform: rotateX(65deg) rotate(360deg); } }

  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button {
    padding:12px 18px; border-radius:40px; border:0; cursor:pointer; font-weight:700;
    background:linear-gradient(90deg,#20cfff,#a44dff); color:#fff; letter-spacing:.06em;
    box-shadow:0 6px 20px rgba(112,76,255,0.18);
  }
  button.secondary { background:linear-gradient(90deg,#44475a,#2f3242); padding:10px 14px; box-shadow:none; }

  .meta { display:flex; gap:18px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .meta p { margin:0; color:#cfc9ff; font-size:14px; }

  .shop {
    width: min(980px, 96vw); background: rgba(10,12,18,0.55); border-radius:12px; padding:12px;
    border:1px solid rgba(150,160,255,0.06);
  }
  .shop h2 { margin:0 0 8px 0; font-size:14px; color:#e7e7ff; letter-spacing:.08em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .card {
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.008));
    border-radius:10px; padding:8px; display:flex; gap:8px; align-items:center;
    justify-content:space-between; border:1px solid rgba(255,255,255,0.03);
  }
  .swatch {
    width:56px; height:56px; border-radius:50%; border:2px solid rgba(255,255,255,0.06);
    box-shadow: inset 0 8px 18px rgba(255,255,255,0.02);
  }
  .card .info { flex:1; margin-left:10px; color:#e7e7ff; font-weight:700; font-size:13px; }
  .card .cost { color:#cbd0ff; font-weight:600; font-size:13px; margin-right:8px; }
  .card button { padding:8px 10px; border-radius:8px; font-weight:700; font-size:13px; }

  .ownedTag { background: rgba(120,200,255,0.09); color:#bfe7ff; padding:6px 8px; border-radius:999px; font-weight:700; font-size:12px; }

  @media (max-width:640px){
    .grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .swatch{ width:48px; height:48px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb::before { animation-duration: 20s !important; }
  }
</style>
</head>
<body>

  <div class="login-panel" id="loginPanel">
    <h2>🔐 Sign in to Orb World</h2>
    <p>Choose your sign-in provider</p>

    <button onclick="demoLogin('Google')">🌐 Continue with Google</button>
    <button onclick="demoLogin('Apple')">🍎 Continue with Apple</button>
    <button onclick="demoLogin('Samsung')">📱 Continue with Samsung</button>
    <button onclick="demoLogin('Firefox')">🦊 Continue with Firefox</button>

    <p id="loginMessage">Demo mode — no account connected.</p>
  </div>

  <h1>ETHAN'S ORB DOMINION</h1>

  <div id="orbContainer">
    <div id="mainOrb" class="orb" aria-label="Energy orb"></div>
  </div>

  <div class="controls">
    <button id="powerButton">⚡ HOLD TO POWER UP! ⚡</button>
    <button id="resetButton" class="secondary">Reset</button>
  </div>

  <div class="meta">
    <p id="status">Energy level: 0%</p>
    <p id="orbCount">Orbs: <span id="orbCountDisplay">0</span></p>
    <p id="equippedLabel">Equipped: <span id="equippedName">Blue Orb</span></p>
  </div>

  <div class="shop" aria-label="Orb shop">
    <h2>Orb Shop — buy and equip orbs</h2>
    <div id="shopGrid" class="grid"></div>
  </div>

<script>
function demoLogin(provider) {
  const msg = document.getElementById('loginMessage');
  if (msg) msg.textContent = provider + ' selected! Real sign-in setup is still needed.';
}

const orbs = [
  {name:"Blue Orb", color:"#168cff", cost:0},
  {name:"Fire Orb", color:"#ff4b18", cost:0},
  {name:"Toxic Orb", color:"#55ff45", cost:70},
  {name:"Golden Orb", color:"#ffd447", cost:190},
  {name:"Purple Orb", color:"#b34cff", cost:293},
  {name:"Ice Orb", color:"#8cf5ff", cost:1340},
  {name:"Dark Orb", color:"#7770a8", cost:2910},
  {name:"Galaxy Orb", color:"#ff55d9", cost:6767},
  {name:"Rainbow Orb", color:"#ffffff", cost:8989},
  {name:"GOD ORB", color:"#ff2222", cost:9210},
  {name:"ULTRA ORB", color:"#00ffdd", cost:10000}
];

const mainOrb = document.getElementById('mainOrb');
const powerButton = document.getElementById('powerButton');
const resetButton = document.getElementById('resetButton');
const status = document.getElementById('status');
const orbCountDisplay = document.getElementById('orbCountDisplay');
const equippedName = document.getElementById('equippedName');
const shopGrid = document.getElementById('shopGrid');

let count = 0;
let owned = [];
let equipped = 0;
let powered = false;
let holdTimer = null;
let power = 1;

function loadState() {
  try {
    const sCount = localStorage.getItem('ethanOrbCount');
    count = sCount ? parseInt(sCount,10) || 0 : 0;
    const sOwned = localStorage.getItem('ethanOrbOwned');
    owned = sOwned ? JSON.parse(sOwned) : [];
    if (!Array.isArray(owned) || owned.length < orbs.length) {
      owned = new Array(orbs.length).fill(0);
      owned[0] = 1; owned[1] = 1;
    }
    const sEquipped = localStorage.getItem('ethanOrbEquipped');
    equipped = (sEquipped !== null) ? (parseInt(sEquipped,10) || 0) : 0;
    if (equipped < 0 || equipped >= orbs.length) equipped = 0;
  } catch (e) {
    count = 0;
    owned = new Array(orbs.length).fill(0);
    owned[0] = 1; owned[1] = 1;
    equipped = 0;
  }
}

function persistAll() {
  try {
    localStorage.setItem('ethanOrbCount', String(count));
    localStorage.setItem('ethanOrbOwned', JSON.stringify(owned));
    localStorage.setItem('ethanOrbEquipped', String(equipped));
  } catch (e) {}
}

function hexToRgb(hex) {
  const h = hex.replace('#','');
  const hs = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const n = parseInt(hs,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lighten(hex, amt) {
  const c = hexToRgb(hex);
  const r = clamp(Math.round(c.r + (255 - c.r)*amt),0,255);
  const g = clamp(Math.round(c.g + (255 - c.g)*amt),0,255);
  const b = clamp(Math.round(c.b + (255 - c.b)*amt),0,255);
  return `rgb(${r},${g},${b})`;
}
function darken(hex, amt) {
  const c = hexToRgb(hex);
  const r = clamp(Math.round(c.r*(1-amt)),0,255);
  const g = clamp(Math.round(c.g*(1-amt)),0,255);
  const b = clamp(Math.round(c.b*(1-amt)),0,255);
  return `rgb(${r},${g},${b})`;
}

function renderOrbAppearance() {
  const orb = orbs[equipped];
  const base = orb.color || '#fff';
  mainOrb.style.background = `radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95) 0%, ${lighten(base,0.25)} 8%, ${base} 26%, ${darken(base,0.25)} 62%, rgba(0,0,0,0) 100%)`;
  equippedName.textContent = orb.name;
}

function renderMeta() {
  orbCountDisplay.textContent = String(count);
  status.textContent = powered ? 'ENERGY LEVEL: 100% ⚡' : 'Energy level: 0%';
  powerButton.textContent = powered ? '💥 POWER DOWN 💥' : '⚡ HOLD TO POWER UP! ⚡';
}

function renderShop() {
  shopGrid.innerHTML = '';
  orbs.forEach((o, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = `radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08) 0%, ${o.color} 30%, ${darken(o.color,0.2)} 100%)`;

    const info = document.createElement('div');
    info.className = 'info';
    info.textContent = o.name;

    const right = document.createElement('div');
    right.style.display = 'flex';
    right.style.alignItems = 'center';
    right.style.gap = '8px';

    if (owned[idx]) {
      if (equipped === idx) {
        const tag = document.createElement('div');
        tag.className = 'ownedTag';
        tag.textContent = 'Equipped';
        right.appendChild(tag);
      } else {
        const btn = document.createElement('button');
        btn.textContent = 'Equip';
        btn.addEventListener('click', () => {
          equipped = idx; persistAll(); renderAll();
        }, { passive: true });
        right.appendChild(btn);
      }
    } else {
      const cost = document.createElement('div');
      cost.className = 'cost';
      cost.textContent = o.cost === 0 ? 'Free' : `${o.cost}`;
      right.appendChild(cost);

      const buy = document.createElement('button');
      buy.textContent = 'Buy';
      buy.disabled = (count < o.cost);
      buy.style.opacity = buy.disabled ? '0.62' : '1';
      buy.addEventListener('click', () => {
        if (count >= o.cost) {
          count -= o.cost; owned[idx] = 1; equipped = idx;
          persistAll(); renderAll();
          buy.animate([{ transform:'scale(1)' }, { transform:'scale(0.96)' }, { transform:'scale(1)' }], { duration:180 });
        } else {
          buy.animate([{ transform:'translateX(-4px)' }, { transform:'translateX(4px)' }, { transform:'translateX(0)' }], { duration:220 });
        }
      }, { passive: true });
      right.appendChild(buy);
    }

    card.appendChild(sw);
    card.appendChild(info);
    card.appendChild(right);
    shopGrid.appendChild(card);
  });
}

function startPower() {
  if (holdTimer !== null) return;

  powered = true;
  mainOrb.classList.add('powered');
  status.textContent = '⚡ FARMING ORBS!!';
  renderMeta();

  function collect() {
    count += power;
    persistAll();
    renderMeta();
    status.textContent = '🔥 +' + power + ' ORBS!!';
  }

  collect();
  holdTimer = setInterval(collect, 150);
}

function stopPower() {
  if (holdTimer === null) return;

  clearInterval(holdTimer);
  holdTimer = null;

  powered = false;
  mainOrb.classList.remove('powered');
  status.textContent = 'Ready to collect!';
  renderMeta();
}

function resetGame() {
  if (!confirm('Reset ALL your orbs and upgrades?')) return;
  count = 0;
  owned = new Array(orbs.length).fill(0);
  owned[0] = 1; owned[1] = 1;
  equipped = 0;
  powered = false;
  persistAll();
  renderAll();
}

function renderAll() {
  renderOrbAppearance();
  renderMeta();
  renderShop();
}

loadState();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(holdTimer);
    holdTimer = null;
    powered = false;
    renderMeta();
  }
});

powerButton.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  startPower();
}, { passive: true });

powerButton.addEventListener('pointerup', stopPower, { passive: true });
powerButton.addEventListener('pointerleave', stopPower, { passive: true });
powerButton.addEventListener('pointercancel', stopPower, { passive: true });
resetButton.addEventListener('click', resetGame, { passive: true });

renderAll();
</script>
</body>
</html>
