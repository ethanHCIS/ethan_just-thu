<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Glowing Energy Orb — POWER UP</title>
<style>
  :root{
    --bg:#03030a;
    --btn-bg:#0b1228;
    --btn-accent:linear-gradient(90deg,#5ce1ff,#b76cff);
  }
  html,body{
    height:100%;
    margin:0;
    background: radial-gradient(1200px 600px at 10% 20%, rgba(50,40,120,0.06), transparent 8%),
                radial-gradient(900px 400px at 90% 80%, rgba(30,90,255,0.03), transparent 6%),
                var(--bg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-font-smoothing:antialiased;
    color:#fff;
    overflow:hidden;
  }

  /* Canvas fills the viewport */
  #stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none; /* allow button clicks */
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  /* UI container */
  .ui {
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:48px;
    display:flex;
    gap:14px;
    align-items:center;
    pointer-events:auto; /* enable pointer events for children */
  }

  /* Power button */
  .power-btn{
    --pad:20px 40px;
    padding:var(--pad);
    border-radius:36px;
    border:1px solid rgba(255,255,255,0.06);
    background:var(--btn-bg);
    color:#e9f7ff;
    font-weight:700;
    letter-spacing:1px;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(80,40,200,0.08), inset 0 -2px 12px rgba(0,0,0,0.35);
    transition:transform .18s ease, box-shadow .18s ease;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .power-btn:active{ transform:translateY(1px) scale(.995); }

  /* Ambient glow behind button (animated) */
  .glow {
    width:180px;
    height:44px;
    border-radius:28px;
    position:absolute;
    left:0; right:0; margin:auto;
    filter:blur(18px);
    opacity:0.8;
    mix-blend-mode:screen;
    z-index:-1;
    transition:opacity .3s ease, transform .3s ease;
  }

  /* small hint text */
  .hint{
    font-size:13px;
    color:rgba(255,255,255,0.65);
    text-align:center;
    margin-top:6px;
  }

  /* powered state */
  .power-btn.powered{
    background:linear-gradient(90deg,#173b7a,#3b0f5a);
    box-shadow:0 20px 60px rgba(100,60,200,0.35), 0 6px 18px rgba(0,0,0,0.5);
    transform:translateY(-2px) scale(1.01);
  }

  /* accessibility focus */
  .power-btn:focus{ outline:2px solid rgba(180,200,255,0.12); outline-offset:3px; }

  @media (max-width:420px){
    .power-btn{ padding:14px 26px; font-size:16px; border-radius:30px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="orb"></canvas>
</div>

<div class="ui" aria-hidden="false">
  <div id="glow" class="glow" style="background:linear-gradient(90deg,#5ce1ff33,#b76cff33);"></div>
  <button id="power" class="power-btn" aria-pressed="false" title="Power up the orb">
    POWER UP
  </button>
</div>

<script>
(() => {
  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d', {alpha:true});
  let W = canvas.width = innerWidth;
  let H = canvas.height = innerHeight;
  let cx = W/2, cy = H/2;

  // Orb configuration (responsive)
  const baseRadius = () => Math.min(W, H) * 0.17; // central orb radius
  let energy = 0;         // current energy (0..1)
  let targetEnergy = 0;   // animation target
  let time = 0;

  // Particles for shimmering glow
  let particles = [];
  function makeParticles(n){
    particles = new Array(n).fill(0).map(() => {
      const r = Math.random() * 0.9 + 0.15; // radius factor (relative to orb)
      return {
        angle: Math.random() * Math.PI * 2,
        r,
        spin: (Math.random()*0.5 + 0.02) * (Math.random()<0.5? -1 : 1),
        size: Math.random()*2.8 + 0.6,
        hueShift: Math.random()*60 - 20
      };
    });
  }
  makeParticles(120);

  // Responsive resize
  function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
    cx = W/2; cy = H/2;
  }
  addEventListener('resize', resize, {passive:true});

  // Utilities
  const lerp = (a,b,t) => a + (b-a)*t;
  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }

  // Draw one frame
  function draw(dt){
    time += dt * 0.001;
    // smooth energy towards target
    energy = lerp(energy, targetEnergy, 0.06);

    // subtle background wipe (keeps trails when low alpha)
    ctx.clearRect(0,0,W,H);

    // slight vignette / ambient glow using radial gradient overlay (adds depth)
    const bigGrad = ctx.createRadialGradient(cx, cy, baseRadius()*0.2, cx, cy, Math.max(W,H)*0.9);
    bigGrad.addColorStop(0, `rgba(20,12,40,${0.12 * energy})`);
    bigGrad.addColorStop(1, 'rgba(0,0,0,0.0)');
    ctx.fillStyle = bigGrad;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    // center pulse factor controls inner brightness and flicker
    const pulse = 1 + Math.sin(time*3.2 + energy*8)*0.07 + Math.sin(time*7.1)*0.03;

    // Main orb radial gradient
    const r = baseRadius() * (1 + 0.45 * energy);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0.0, `rgba(255,255,255,${0.95 * (0.65 + energy*0.35) * pulse})`);
    g.addColorStop(0.12, `rgba(140,200,255,${0.85 * (0.6 + energy*0.3)})`); // bright blue
    g.addColorStop(0.32, `rgba(120,100,255,${0.65 * (0.4 + energy*0.4)})`); // purple
    g.addColorStop(0.62, `rgba(40,15,80,${0.28 * energy})`); // dark purple
    g.addColorStop(1.0, `rgba(10,6,18,0.0)`);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();

    // Glow ring (soft stroke)
    ctx.beginPath();
    ctx.lineWidth = Math.max(2, Math.min(36, r * 0.12 * (0.6 + energy)));
    ctx.strokeStyle = `rgba(160,120,255,${0.14 + 0.35*energy})`;
    ctx.shadowColor = `rgba(120,140,255,${0.22 + 0.5*energy})`;
    ctx.shadowBlur = 40 * (0.6 + energy);
    ctx.arc(cx, cy, r * (1 + 0.06 * energy), 0, Math.PI*2);
    ctx.stroke();

    // Add particles shimmer with additive blending
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(8px)';
    for (let i=0;i<particles.length;i++){
      const p = particles[i];
      p.angle += p.spin * (0.8 + energy*3) * dt * 0.001;
      const px = cx + Math.cos(p.angle) * r * p.r * (0.65 + 0.35*energy);
      const py = cy + Math.sin(p.angle) * r * p.r * (0.65 + 0.35*energy);
      const size = p.size * (1 + energy*2) * (0.6 + 0.4*Math.abs(Math.sin(time*2 + i)));
      const grd = ctx.createRadialGradient(px, py, 0, px, py, size*4);
      const hue = 220 + p.hueShift + energy*40; // between blue and purple
      grd.addColorStop(0, `rgba(255,255,255,${0.45 + 0.55*energy})`);
      grd.addColorStop(0.18, `hsla(${hue},100%,65%,${0.36 + 0.45*energy})`);
      grd.addColorStop(1, `hsla(${hue+30},85%,35%,0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(px, py, size*4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.filter = 'none';

    // Core flicker (sharp)
    ctx.globalCompositeOperation = 'screen';
    const innerR = r * (0.22 + 0.05*energy);
    const innerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, innerR * 2.3);
    innerGrad.addColorStop(0, `rgba(255,255,255,${0.95 * (0.9 + energy*0.1)})`);
    innerGrad.addColorStop(0.6, `rgba(200,230,255,${0.25 + 0.35*energy})`);
    innerGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = innerGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, innerR * (1.6 + 0.4*Math.sin(time*6)), 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // Slight chromatic outer haze
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.28 * energy;
    const haze = ctx.createRadialGradient(cx-20, cy-8, 0, cx, cy, r*2.6);
    haze.addColorStop(0, 'rgba(100,200,255,0.6)');
    haze.addColorStop(0.6, 'rgba(180,100,255,0.15)');
    haze.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = haze;
    ctx.beginPath();
    ctx.arc(cx, cy, r*2.6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Animation loop
  let last = performance.now();
  function frame(now){
    const dt = now - last;
    last = now;
    draw(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // POWER UP control
  const powerBtn = document.getElementById('power');
  const glowEl = document.getElementById('glow');

  let powering = false;
  function powerSequence(){
    if(powering) return;
    powering = true;
    powerBtn.classList.add('powered');
    powerBtn.setAttribute('aria-pressed', 'true');
    // ramp up
    targetEnergy = 1;
    makeParticles(220); // increase shimmer
    // animate glow element behind button
    glowEl.style.transition = 'transform .5s cubic-bezier(.2,.9,.2,1), opacity .5s';
    glowEl.style.transform = 'scale(1.18)';
    glowEl.style.opacity = '1';
    // hold for a bit, then fade
    setTimeout(() => {
      // ramp down
      targetEnergy = 0;
      makeParticles(110);
      powerBtn.classList.remove('powered');
      powerBtn.setAttribute('aria-pressed', 'false');
      glowEl.style.transform = 'scale(1)';
      glowEl.style.opacity = '0.55';
      powering = false;
    }, 2300);
  }

  powerBtn.addEventListener('click', powerSequence);
  powerBtn.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); powerSequence(); } });

  // subtle idle breathing even when not powered
  (function idlePulse(){
    setInterval(() => {
      // very small idle wobble to keep it alive
      targetEnergy = Math.max(0, targetEnergy);
      if(targetEnergy === 0 && !powering){
        // tiny randomized idle spikes
        const spike = Math.random() < 0.08;
        if(spike){
          targetEnergy = 0.26 + Math.random()*0.14;
          setTimeout(()=> targetEnergy = 0, 380 + Math.random()*600);
        }
      }
    }, 700);
  })();

  // Initialize glow element state
  glowEl.style.opacity = '0.55';
  glowEl.style.transform = 'scale(1)';
})();
</script>
</body>
</html>
